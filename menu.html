<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>เมนู</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/db.js"></script>
<style>
:root{
  --red:#B91C1C;--dark:#111827;--bg:#F9FAFB;
  --card:#FFF;--border:#E5E7EB;--sub:#6B7280;--green:#059669;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Thonburi,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:100px}

/* Header */
.header{background:var(--dark);position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.4)}
.header-main{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand-name{font-size:1rem;font-weight:800;color:#FFF}
.brand-sub{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:1px}
.hright{display:flex;align-items:center;gap:8px}
.table-badge{background:var(--red);color:#FFF;font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:6px}
.bill-btn{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#FFF;border-radius:8px;padding:5px 12px;font-size:.74rem;font-weight:700;cursor:pointer;display:none;transition:all .2s}
.bill-btn:hover{background:rgba(255,255,255,.1)}
.bill-btn.show{display:block}

/* Cats */
.cats{background:var(--dark);padding:0 14px 11px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.5);border-radius:7px;padding:6px 13px;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.cat-pill.on{background:var(--red);color:#FFF}

/* Menu */
.section{padding:18px 13px 0}
.sec-label{font-size:.68rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:11px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:26px}

.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);position:relative}
.card:active{transform:scale(.98)}
.card-img-wrap{height:142px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card-img-wrap img{width:100%;height:142px;object-fit:cover;display:block;transition:opacity .4s}
.card-img-wrap img.loading{opacity:0}
.card-img-wrap img.loaded{opacity:1}
/* Placeholder while loading */
.card-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;transition:opacity .4s}
.card-placeholder.hidden{opacity:0;pointer-events:none}
/* Category gradient placeholders */
.g0{background:linear-gradient(135deg,#FEF3C7,#FDE68A)}
.g1{background:linear-gradient(135deg,#FEE2E2,#FECACA)}
.g2{background:linear-gradient(135deg,#DBEAFE,#BFDBFE)}
.g3{background:linear-gradient(135deg,#D1FAE5,#A7F3D0)}
.g4{background:linear-gradient(135deg,#FCE7F3,#FBCFE8)}

.qty-badge{position:absolute;top:7px;right:7px;background:var(--red);color:#FFF;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.card-body{padding:9px 11px 11px}
.card-name{font-size:.84rem;font-weight:800;line-height:1.3;margin-bottom:3px}
.card-desc{font-size:.69rem;color:var(--sub);line-height:1.4;margin-bottom:8px;min-height:16px}
.card-foot{display:flex;align-items:center;justify-content:space-between}
.card-price{font-size:.98rem;font-weight:900;color:var(--red)}
.add-btn{width:30px;height:30px;border-radius:50%;background:var(--red);color:#FFF;border:none;font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* FAB */
#fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--red);color:#FFF;border:none;border-radius:14px;padding:13px 24px;font-size:.88rem;font-weight:800;box-shadow:0 8px 28px rgba(185,28,28,.45);cursor:pointer;display:none;z-index:300;min-width:240px;text-align:center}
#fab:active{transform:translateX(-50%) scale(.97)}

/* Overlay + Drawer */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;backdrop-filter:blur(3px)}
.ov.on{display:block}
.drawer{position:fixed;bottom:0;left:0;right:0;background:#FFF;border-radius:20px 20px 0 0;z-index:500;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.drawer.open{transform:none}
.d-handle{width:36px;height:4px;background:#E5E7EB;border-radius:99px;margin:14px auto 0}
.d-head{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #F3F4F6;position:sticky;top:0;background:#FFF;z-index:1}
.d-title{font-size:.97rem;font-weight:800}
.d-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--sub)}
.d-body{padding:0 18px 28px}

/* Cart items */
.ci{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #F3F4F6}
.ci-thumb{width:50px;height:50px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#F3F4F6}
.ci-thumb-placeholder{width:50px;height:50px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.83rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-size:.72rem;color:var(--sub);margin-top:2px}
.qc{display:flex;align-items:center;gap:7px}
.qc-btn{width:26px;height:26px;border-radius:50%;font-size:.9rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qc-m{background:#F3F4F6;border:1.5px solid var(--border);color:var(--dark)}
.qc-p{background:var(--red);border:none;color:#FFF}
.qc-n{font-size:.85rem;font-weight:800;min-width:18px;text-align:center}

.note-wrap{margin:13px 0 0}
.note-wrap label{font-size:.72rem;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.note-wrap textarea{width:100%;background:#F9FAFB;border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;font-size:.83rem;resize:none;outline:none;font-family:inherit;transition:border .2s}
.note-wrap textarea:focus{border-color:var(--red);background:#FFF}

.totals{margin:13px 0 0;padding:12px 0 0;border-top:1px solid #F3F4F6}
.trow{display:flex;justify-content:space-between;font-size:.82rem;color:var(--sub);padding:2px 0}
.trow.grand{font-size:1.05rem;font-weight:900;color:var(--dark);padding-top:9px;margin-top:6px;border-top:1.5px solid var(--border)}
.trow.grand span:last-child{color:var(--red)}

.pbtn{display:block;width:100%;background:var(--red);color:#FFF;border:none;border-radius:12px;padding:14px;font-size:.9rem;font-weight:800;cursor:pointer;margin-top:13px}
.pbtn:hover{background:#991B1B}
.pbtn:disabled{background:#D1D5DB;cursor:not-allowed}
.gbtn{display:block;width:100%;background:#F3F4F6;color:var(--dark);border:none;border-radius:12px;padding:12px;font-size:.85rem;font-weight:700;cursor:pointer;margin-top:7px}

/* Bill */
.bill-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F3F4F6;font-size:.83rem}
.bill-item.muted{color:var(--sub);font-size:.76rem}
.bill-item.grand{font-size:1.08rem;font-weight:900;color:var(--red);border:none;border-top:2px solid var(--red);margin-top:5px;padding-top:11px}
.bill-sep{height:1px;background:#F3F4F6;margin:11px 0}

/* PromptPay */
.pp-box{background:#F0FDF4;border:1.5px solid #A7F3D0;border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.pp-label{font-size:.68rem;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.pp-sub{font-size:.78rem;color:#065F46;font-weight:600;margin-bottom:14px}
.pp-qr-wrap{display:flex;justify-content:center;margin-bottom:12px}
.pp-amount{font-size:1.5rem;font-weight:900;color:var(--green)}
.pp-hint{font-size:.68rem;color:var(--sub);margin-top:5px}

/* Fullscreen */
.fs{display:none;position:fixed;inset:0;z-index:999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
.fs.show{display:flex}
#fs-ok{background:#FFF}
#fs-sent{background:var(--dark)}
.fs-ico{font-size:5rem;margin-bottom:16px}
.fs-h{font-size:1.45rem;font-weight:900;margin-bottom:7px}
#fs-ok .fs-h{color:var(--green)}
#fs-sent .fs-h{color:#FFF}
.fs-p{font-size:.85rem;line-height:1.65;margin-bottom:26px}
#fs-ok .fs-p{color:var(--sub)}
#fs-sent .fs-p{color:rgba(255,255,255,.5)}
.fs-btn{border:none;border-radius:12px;padding:12px 30px;font-size:.9rem;font-weight:800;cursor:pointer}
#fs-ok .fs-btn{background:var(--red);color:#FFF}
#fs-sent .fs-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#FFF}

.sp{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#FFF;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.img-loading-bar{height:3px;background:linear-gradient(90deg,var(--red),#F87171,var(--red));background-size:200%;animation:shimmer 1.2s linear infinite;border-radius:3px;margin-bottom:8px;display:none}
.img-loading-bar.show{display:block}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
</style>
</head>
<body>

<div class="header">
  <div class="header-main">
    <div>
      <div class="brand-name">ร้านอาหาร Demo</div>
      <div class="brand-sub" id="brand-sub">กำลังโหลด…</div>
    </div>
    <div class="hright">
      <button class="bill-btn" id="bill-btn" onclick="openBill()">ขอบิล</button>
      <div class="table-badge" id="tbl-badge">—</div>
    </div>
  </div>
  <div class="cats" id="cats"></div>
</div>

<!-- Image loading indicator -->
<div class="img-loading-bar" id="img-bar"></div>

<div id="menu-content"></div>

<button id="fab" onclick="openCart()">
  ตะกร้า <span id="fab-n">0</span> รายการ &nbsp;•&nbsp; ฿<span id="fab-t">0</span>
</button>

<div class="ov" id="ov" onclick="closeAll()"></div>

<!-- Cart -->
<div class="drawer" id="cart-drawer">
  <div class="d-handle"></div>
  <div class="d-head"><div class="d-title">รายการสั่ง</div><button class="d-close" onclick="closeAll()">✕</button></div>
  <div class="d-body">
    <div id="cart-list"></div>
    <div class="note-wrap">
      <label>หมายเหตุ</label>
      <textarea id="note" rows="2" placeholder="เช่น ไม่เผ็ด, ไม่ใส่ผัก…"></textarea>
    </div>
    <div class="totals" id="cart-totals"></div>
    <button class="pbtn" id="order-btn" onclick="submitOrder()">ส่งออเดอร์</button>
    <button class="gbtn" onclick="closeAll()">ยกเลิก</button>
  </div>
</div>

<!-- Bill -->
<div class="drawer" id="bill-drawer">
  <div class="d-handle"></div>
  <div class="d-head"><div class="d-title">บิลโต๊ะ <span id="bill-tbl"></span></div><button class="d-close" onclick="closeAll()">✕</button></div>
  <div class="d-body" id="bill-body"><div style="text-align:center;padding:30px;color:var(--sub)">กำลังโหลด…</div></div>
</div>

<!-- Fullscreen states -->
<div class="fs" id="fs-ok">
  <div class="fs-ico">✅</div>
  <div class="fs-h">ส่งออเดอร์สำเร็จ</div>
  <div class="fs-p">ทีมงานกำลังเตรียมอาหารให้คุณ<br>กรุณารอสักครู่</div>
  <button class="fs-btn" onclick="afterOrder()">+ สั่งเพิ่ม</button>
</div>
<div class="fs" id="fs-sent">
  <div class="fs-ico">🔔</div>
  <div class="fs-h">แจ้งพนักงานแล้ว</div>
  <div class="fs-p">พนักงานได้รับแจ้งการชำระเงินแล้ว<br>กรุณารอการยืนยันสักครู่</div>
  <button class="fs-btn" onclick="afterBill()">กลับหน้าเมนู</button>
</div>

<script>
// ── URL params ──
const qp = new URLSearchParams(location.search);
const tableNum = qp.get('table') || '?';
const ghU = qp.get('u')||'', ghR = qp.get('r')||'', ghK = qp.get('k')||'', ppN = qp.get('pp')||'';
if (ghU && ghR && ghK) { try { DB.saveConfig(ghU, ghR, atob(decodeURIComponent(ghK))); } catch(e){} }
if (ppN) localStorage.setItem('promptpay', ppN);
document.getElementById('tbl-badge').textContent = `โต๊ะ ${tableNum}`;
document.getElementById('bill-tbl').textContent = tableNum;
document.getElementById('brand-sub').textContent = `โต๊ะที่ ${tableNum}`;
document.title = `เมนู — โต๊ะ ${tableNum}`;

// ── Wikipedia image loader ──
// Map item name → English Wikipedia article title
const WIKI = {
  'ข้าวผัดกุ้ง':          'Thai_fried_rice',
  'ข้าวราดกะเพราหมูกรอบ': 'Phat_kraphao',
  'ข้าวมันไก่':            'Khao_man_gai',
  'ข้าวหน้าเป็ดพะโล้':    'Khao_na_pet',
  'แกงเขียวหวานไก่':       'Thai_green_curry',
  'ข้าวผัดไก่':            'Fried_rice',
  'ผัดไทยกุ้ง':           'Pad_thai',
  'ผัดซีอิ๊วหมู':         'Pad_see_ew',
  'ก๋วยเตี๋ยวหมูน้ำใส':   'Kuaitiao',
  'ก๋วยเตี๋ยวเนื้อตุ๋น':  'Boat_noodles',
  'บะหมี่แห้งหมูแดง':     'Chinese_noodles',
  'กุ้งผัดพริกแกง':        'Thai_curry',
  'ปลาราดพริก':            'Pla_rad_prik',
  'หอยลายผัดฉ่า':          'Phat_cha',
  'ปูผัดผงกะหรี่':         'Crab_curry',
  'ชาไทยเย็น':             'Thai_tea',
  'กาแฟเย็น':              'Iced_coffee',
  'น้ำส้มคั้น':            'Orange_juice',
  'น้ำมะนาวโซดา':          'Lemonade',
  'น้ำอัดลม':              'Cola',
  'น้ำเปล่า':              'Mineral_water',
  'ข้าวเหนียวมะม่วง':      'Mango_sticky_rice',
  'ไอศกรีมกะทิ':           'Coconut_ice_cream',
  'บัวลอยน้ำขิง':          'Tang_yuan',
  'ทับทิมกรอบ':            'Thapthim_krop',
};

// Cache fetched image URLs
const imgCache = {};

async function fetchWikiImg(article) {
  if (imgCache[article] !== undefined) return imgCache[article];
  try {
    const r = await fetch(
      `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(article)}`,
      { headers: { 'Api-User-Agent': 'ThaiRestaurantDemo/1.0 (educational)' } }
    );
    if (!r.ok) { imgCache[article] = null; return null; }
    const d = await r.json();
    const src = d.thumbnail?.source;
    if (!src) { imgCache[article] = null; return null; }
    // Upgrade resolution from default (320px) to 500px
    const big = src.replace(/\/\d+px-/, '/500px-');
    imgCache[article] = big;
    return big;
  } catch(e) { imgCache[article] = null; return null; }
}

// Load images for all visible cards, replace placeholder with real photo
async function loadImages() {
  const bar = document.getElementById('img-bar');
  bar.classList.add('show');

  const allItems = MENU.flatMap(s => s.items);
  const loaded = { count: 0, total: allItems.filter(i => WIKI[i.name]).length };

  await Promise.all(allItems.map(async (item, idx) => {
    const article = WIKI[item.name];
    if (!article) return;
    const url = await fetchWikiImg(article);
    loaded.count++;
    if (loaded.count >= loaded.total) bar.classList.remove('show');
    if (!url) return;

    // Find the card's img+placeholder by data attribute
    const wrap = document.querySelector(`[data-wiki="${idx}"]`);
    if (!wrap) return;

    const img = new Image();
    img.onload = () => {
      const placeholder = wrap.querySelector('.card-placeholder');
      const imgEl = wrap.querySelector('img');
      if (placeholder) placeholder.classList.add('hidden');
      if (imgEl) {
        imgEl.src = url;
        imgEl.style.display = 'block';
        imgEl.classList.remove('loading');
        imgEl.classList.add('loaded');
      }
    };
    img.src = url;
  }));

  bar.classList.remove('show');
}

// ── Menu data ──
const CATS_GRAD = ['g0','g1','g2','g3','g4'];
const MENU = [
  { cat:'อาหารจานหลัก', items:[
    { name:'ข้าวผัดกุ้ง',          price:85,  desc:'กุ้งสด ไข่ไก่ ผักสด',            emoji:'🦐' },
    { name:'ข้าวราดกะเพราหมูกรอบ', price:80,  desc:'หมูกรอบ ใบกะเพรา ไข่ดาว',       emoji:'🌶️' },
    { name:'ข้าวมันไก่',            price:80,  desc:'ไก่นึ่งน้ำขิง ข้าวมัน ซอสพิเศษ', emoji:'🍗' },
    { name:'ข้าวหน้าเป็ดพะโล้',    price:90,  desc:'เป็ดพะโล้สูตรโบราณ',             emoji:'🦆' },
    { name:'แกงเขียวหวานไก่',       price:75,  desc:'กะทิสด พริกเขียวหอม',            emoji:'🍛' },
    { name:'ข้าวผัดไก่',            price:70,  desc:'ไก่นุ่ม ไข่ไก่ น้ำมันหอย',       emoji:'🍚' },
  ]},
  { cat:'ก๋วยเตี๋ยว', items:[
    { name:'ผัดไทยกุ้ง',           price:85,  desc:'กุ้งสด เต้าหู้ ถั่วงอก มะนาว',  emoji:'🍜' },
    { name:'ผัดซีอิ๊วหมู',         price:75,  desc:'หมูนุ่ม เส้นใหญ่ คะน้า',         emoji:'🥢' },
    { name:'ก๋วยเตี๋ยวหมูน้ำใส',   price:65,  desc:'น้ำซุปใส หมูสามชั้น ลูกชิ้น',   emoji:'🍲' },
    { name:'ก๋วยเตี๋ยวเนื้อตุ๋น',  price:85,  desc:'เนื้อตุ๋นนุ่ม น้ำเข้มข้น',       emoji:'🥩' },
    { name:'บะหมี่แห้งหมูแดง',     price:70,  desc:'หมูแดงหอม บะหมี่แห้งพิเศษ',     emoji:'🍝' },
  ]},
  { cat:'อาหารทะเล', items:[
    { name:'กุ้งผัดพริกแกง',       price:130, desc:'กุ้งแม่น้ำ พริกแกงบ้าน',         emoji:'🦐' },
    { name:'ปลาราดพริก',           price:150, desc:'ปลากะพงทอด ราดพริกสด',            emoji:'🐟' },
    { name:'หอยลายผัดฉ่า',         price:120, desc:'หอยสด พริก ใบโหระพา',             emoji:'🐚' },
    { name:'ปูผัดผงกะหรี่',        price:180, desc:'ปูม้าสด ผงกะหรี่นำเข้า',          emoji:'🦀' },
  ]},
  { cat:'เครื่องดื่ม', items:[
    { name:'ชาไทยเย็น',            price:35,  desc:'ชาไทยแท้ นมข้น กะทิสด',          emoji:'🧋' },
    { name:'กาแฟเย็น',             price:45,  desc:'กาแฟโรบัสต้า นมสด',              emoji:'☕' },
    { name:'น้ำส้มคั้น',           price:50,  desc:'ส้มคั้นสด 100%',                  emoji:'🍊' },
    { name:'น้ำมะนาวโซดา',         price:40,  desc:'มะนาวสด โซดา',                   emoji:'🍋' },
    { name:'น้ำอัดลม',             price:25,  desc:'Coke / Sprite / Fanta',           emoji:'🥤' },
    { name:'น้ำเปล่า',             price:15,  desc:'น้ำดื่มบรรจุขวด',                 emoji:'💧' },
  ]},
  { cat:'ของหวาน', items:[
    { name:'ข้าวเหนียวมะม่วง',     price:65,  desc:'มะม่วงน้ำดอกไม้ ข้าวเหนียวมูน',  emoji:'🥭' },
    { name:'ไอศกรีมกะทิ',          price:45,  desc:'กะทิสด ถั่วลิสง ข้าวเหนียว',     emoji:'🍨' },
    { name:'บัวลอยน้ำขิง',         price:40,  desc:'บัวลอยสามสี น้ำขิงหอม',          emoji:'🍡' },
    { name:'ทับทิมกรอบ',           price:45,  desc:'แห้วกรอบ กะทิสด น้ำแข็งใส',      emoji:'🔴' },
  ]},
];

// Global index for wiki attribute
let globalItemIdx = 0;
// Store item data by wiki index for cart thumbnails
const itemByWikiIdx = {};

let cart = {}, hasOrdered = false;

function buildMenu() {
  const cEl = document.getElementById('cats');
  const mEl = document.getElementById('menu-content');
  globalItemIdx = 0;

  MENU.forEach((sec, si) => {
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (si===0?' on':'');
    pill.textContent = sec.cat;
    pill.onclick = () => {
      document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('on'));
      pill.classList.add('on');
      document.getElementById(`sec${si}`).scrollIntoView({behavior:'smooth',block:'start'});
    };
    cEl.appendChild(pill);

    const secEl = document.createElement('div');
    secEl.className = 'section'; secEl.id = `sec${si}`;
    secEl.innerHTML = `<div class="sec-label">${sec.cat}</div><div class="grid" id="gr${si}"></div>`;
    mEl.appendChild(secEl);

    sec.items.forEach(item => {
      const wi = globalItemIdx++;
      itemByWikiIdx[wi] = item;

      const card = document.createElement('div');
      card.className = 'card';

      // Image wrap: shows emoji placeholder, img tag for later
      card.innerHTML = `
        <div class="card-img-wrap" data-wiki="${wi}">
          <img class="loading" src="" alt="${item.name}" style="display:none">
          <div class="card-placeholder ${CATS_GRAD[si]}">${item.emoji}</div>
        </div>
        <div class="card-body">
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-foot">
            <span class="card-price">฿${item.price}</span>
            <button class="add-btn" onclick="event.stopPropagation();addItem(${wi})">+</button>
          </div>
        </div>`;

      document.getElementById(`gr${si}`).appendChild(card);
      card._itemData = item; // keep reference for badge
    });
  });
}

function addItem(wi) {
  const item = itemByWikiIdx[wi];
  if (!item) return;
  const k = item.name;
  cart[k] ? cart[k].qty++ : (cart[k] = {...item, wi, qty:1});
  updateFAB(); updateBadge(k);
}

function updateFAB() {
  const cnt = Object.values(cart).reduce((s,i)=>s+i.qty,0);
  const tot = Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('fab-n').textContent = cnt;
  document.getElementById('fab-t').textContent = tot.toLocaleString();
  document.getElementById('fab').style.display = cnt>0?'block':'none';
}

function updateBadge(name) {
  // Find card by searching all cards
  const wraps = document.querySelectorAll('.card-img-wrap');
  wraps.forEach(w => {
    const wi = parseInt(w.dataset.wiki);
    if (itemByWikiIdx[wi]?.name !== name) return;
    const card = w.closest('.card');
    if (!card) return;
    let b = card.querySelector('.qty-badge');
    const qty = cart[name]?.qty || 0;
    if (qty===0) { b?.remove(); return; }
    if (!b) { b=document.createElement('div'); b.className='qty-badge'; w.appendChild(b); }
    b.textContent = qty;
  });
}

function showDrawer(id) {
  document.getElementById('ov').classList.add('on');
  document.getElementById(id).classList.add('open');
}
function closeAll() {
  document.getElementById('ov').classList.remove('on');
  document.querySelectorAll('.drawer').forEach(d=>d.classList.remove('open'));
}

// ── Cart ──
function openCart() {
  const list = document.getElementById('cart-list');
  list.innerHTML = '';
  let sub=0;
  Object.values(cart).forEach(item => {
    sub += item.price*item.qty;
    // Get cached image for thumbnail
    const article = WIKI[item.name];
    const cachedImg = article ? imgCache[article] : null;
    const thumbHtml = cachedImg
      ? `<img class="ci-thumb" src="${cachedImg}" alt="${item.name}">`
      : `<div class="ci-thumb-placeholder ${CATS_GRAD[MENU.findIndex(s=>s.items.some(i=>i.name===item.name))]||'g0'}">${item.emoji}</div>`;
    const div = document.createElement('div');
    div.className='ci';
    div.innerHTML = `
      ${thumbHtml}
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-sub">฿${item.price} × ${item.qty} = ฿${(item.price*item.qty).toLocaleString()}</div>
      </div>
      <div class="qc">
        <button class="qc-btn qc-m" onclick="adj('${item.name}',-1)">−</button>
        <span class="qc-n">${item.qty}</span>
        <button class="qc-btn qc-p" onclick="adj('${item.name}',1)">+</button>
      </div>`;
    list.appendChild(div);
  });
  const svc=Math.round(sub*10/100), vat=Math.round((sub+svc)*7/100), grand=sub+svc+vat;
  document.getElementById('cart-totals').innerHTML = `
    <div class="trow"><span>ค่าอาหาร</span><span>฿${sub.toLocaleString()}</span></div>
    <div class="trow"><span>Service Charge 10%</span><span>฿${svc.toLocaleString()}</span></div>
    <div class="trow"><span>VAT 7%</span><span>฿${vat.toLocaleString()}</span></div>
    <div class="trow grand"><span>รวมสุทธิ</span><span>฿${grand.toLocaleString()}</span></div>`;
  showDrawer('cart-drawer');
}

function adj(name, d) {
  if (!cart[name]) return;
  cart[name].qty += d;
  if (cart[name].qty<=0) { delete cart[name]; updateBadge(name); }
  updateFAB();
  if (!Object.keys(cart).length) { closeAll(); return; }
  openCart();
}

async function submitOrder() {
  if (!Object.keys(cart).length) return;
  if (!DB.isReady()) { alert('❌ QR Code ยังไม่ได้ตั้งค่า'); return; }
  const btn = document.getElementById('order-btn');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>กำลังส่ง…';
  const items = Object.values(cart);
  const sub = items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc = Math.round(sub*10/100), vat = Math.round((sub+svc)*7/100);
  const order = {
    id:'ord_'+Date.now(), table:tableNum, items,
    subtotal:sub, serviceCharge:svc, vat, total:sub+svc+vat,
    note:document.getElementById('note').value.trim(),
    status:'pending',
    time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),
    timestamp:Date.now()
  };
  try {
    await DB.addOrder(order);
    closeAll(); hasOrdered=true;
    document.getElementById('bill-btn').classList.add('show');
    document.getElementById('fs-ok').classList.add('show');
    cart={};
    document.querySelectorAll('.qty-badge').forEach(b=>b.remove());
    updateFAB();
  } catch(e) {
    let m=e.message||'';
    if(m.includes('401')) m='Token ไม่ถูกต้อง/หมดอายุ';
    else if(m.includes('403')) m='Token ไม่มีสิทธิ์เขียน (Contents→Read & Write)';
    else if(m.includes('404')) m='ไม่พบ repo หรือ orders.json';
    alert('❌ ส่งออเดอร์ไม่สำเร็จ: '+m);
  } finally { btn.disabled=false; btn.innerHTML='ส่งออเดอร์'; }
}

function afterOrder() { document.getElementById('fs-ok').classList.remove('show'); }

// ── PromptPay QR ──
function crc16(s) {
  let c=0xFFFF;
  for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?(c<<1)^0x1021:c<<1;c&=0xFFFF;}}
  return c;
}
function makePromptPay(phone, amount) {
  const f=(id,v)=>`${id}${('0'+v.length).slice(-2)}${v}`;
  let ph=phone.replace(/\D/g,'');
  if(ph.startsWith('0')) ph='66'+ph.slice(1);
  ph=ph.padStart(13,'0');
  const acct=f('00','A000000677010111')+f('01',ph);
  let d=f('00','01')+f('01','12')+f('29',acct)+f('52','5812')+f('53','764')+
        f('54',amount.toFixed(2))+f('58','TH')+f('59','RESTAURANT')+f('60','Bangkok')+'6304';
  return d+crc16(d).toString(16).toUpperCase().padStart(4,'0');
}

// ── Bill ──
async function openBill() {
  closeAll();
  const body = document.getElementById('bill-body');
  body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--sub)">กำลังโหลด…</div>';
  showDrawer('bill-drawer');
  try {
    const allOrders = await DB.getOrders();
    const myOrders = allOrders.filter(o=>String(o.table)===String(tableNum) && !['bill_request','payment_claimed'].includes(o.type));
    if (!myOrders.length) { body.innerHTML='<div style="text-align:center;padding:30px;color:var(--sub)">ยังไม่มีออเดอร์</div>'; return; }
    const merged={};
    myOrders.forEach(o=>(o.items||[]).forEach(i=>{merged[i.name]?merged[i.name].qty+=i.qty:(merged[i.name]={...i});}));
    const sub = myOrders.reduce((s,o)=>s+(o.subtotal||0),0);
    const svc=Math.round(sub*10/100), vat=Math.round((sub+svc)*7/100), grand=sub+svc+vat;
    const pp = localStorage.getItem('promptpay')||'';
    let ppHtml='';
    if (pp) {
      ppHtml=`<div class="pp-box">
        <div class="pp-label">ชำระผ่าน PromptPay</div>
        <div class="pp-sub">สแกน QR Code เพื่อชำระเงิน</div>
        <div class="pp-qr-wrap" id="pp-qr"></div>
        <div class="pp-amount">฿${grand.toLocaleString()}</div>
        <div class="pp-hint">โอนแล้วกด "แจ้งพนักงาน" ด้านล่าง</div>
      </div>`;
    }
    body.innerHTML = `
      ${Object.values(merged).map(i=>`
        <div class="bill-item"><span>${i.emoji} ${i.name} × ${i.qty}</span><span>฿${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}
      <div class="bill-sep"></div>
      <div class="bill-item muted"><span>ค่าอาหาร</span><span>฿${sub.toLocaleString()}</span></div>
      <div class="bill-item muted"><span>Service Charge 10%</span><span>฿${svc.toLocaleString()}</span></div>
      <div class="bill-item muted"><span>VAT 7%</span><span>฿${vat.toLocaleString()}</span></div>
      <div class="bill-item grand"><span>รวมสุทธิ</span><span>฿${grand.toLocaleString()}</span></div>
      ${ppHtml}
      <button class="pbtn" id="claim-btn" onclick="claimPayment()">โอนแล้ว / แจ้งพนักงาน</button>
      <button class="gbtn" onclick="closeAll()">ปิด</button>`;
    if (pp) {
      new QRCode(document.getElementById('pp-qr'),{
        text:makePromptPay(pp,grand), width:170, height:170,
        colorDark:'#065F46', colorLight:'#F0FDF4',
        correctLevel:QRCode.CorrectLevel.M
      });
    }
  } catch(e) { body.innerHTML=`<div style="padding:20px;color:var(--red)">❌ ${e.message}</div>`; }
}

async function claimPayment() {
  const btn=document.getElementById('claim-btn');
  if(!btn) return;
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>กำลังส่ง…';
  try {
    await DB.addOrder({
      id:'pay_'+Date.now(), type:'payment_claimed', table:tableNum,
      status:'pending',
      time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),
      timestamp:Date.now()
    });
    closeAll();
    document.getElementById('fs-sent').classList.add('show');
  } catch(e) {
    alert('ไม่สามารถแจ้งได้: '+e.message);
    btn.disabled=false; btn.innerHTML='โอนแล้ว / แจ้งพนักงาน';
  }
}
function afterBill() { document.getElementById('fs-sent').classList.remove('show'); }

// ── Init ──
buildMenu();
// Load Wikipedia images after menu is built (non-blocking)
requestAnimationFrame(() => loadImages());
</script>
