<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แคชเชียร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="js/db.js"></script>
<style>
:root{
  --red:#DC2626;--red-dark:#B91C1C;--dark:#1A1A2E;
  --bg:#F8F7FF;--card:#FFF;--sub:#64748B;
  --green:#059669;--orange:#F97316;--border:#E9E5F5;
  --shadow:0 2px 12px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);
  --shadow-md:0 4px 24px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',-apple-system,sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
header{background:var(--dark);color:white;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:-.2px}
.logo em{color:#FF6B6B;font-style:normal}
.hright{display:flex;align-items:center;gap:10px}
.hclock{font-size:.82rem;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
.icon-btn{background:rgba(255,255,255,.1);color:white;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;padding:0 14px;height:36px;font-size:.8rem;cursor:pointer;transition:background .2s;font-family:inherit}
.icon-btn:hover{background:rgba(255,255,255,.18)}

/* ── NAV ── */
nav{background:var(--dark);border-top:1px solid rgba(255,255,255,.07);display:flex}
nav a{color:rgba(255,255,255,.4);text-decoration:none;padding:0 18px;height:44px;display:inline-flex;align-items:center;font-size:.8rem;transition:color .2s;border-bottom:2px solid transparent}
nav a:hover{color:rgba(255,255,255,.8)}
nav a.active{color:#FF6B6B;border-color:#FF6B6B}

.layout{display:flex;height:calc(100vh - 90px)}

/* ── SIDEBAR ── */
.sidebar{width:210px;min-width:210px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-title{padding:14px 16px;font-size:.68rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);background:#FAFAFA}
.tbl-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:52px;border-bottom:1px solid #F4F4F8;cursor:pointer;transition:background .15s}
.tbl-row:hover{background:#FBF9FF}
.tbl-row.active{background:linear-gradient(to right,#FFF1F1,#FFF8F5);border-right:3px solid var(--red)}
.tbl-name{font-size:.88rem;font-weight:700}
.tbl-pill{font-size:.62rem;font-weight:800;padding:3px 9px;border-radius:999px}
.tp-vacant{background:#ECFDF5;color:#065F46}
.tp-busy{background:#FFFBEB;color:#92400E}
.tp-bill{background:#FEF2F2;color:var(--red)}

/* ── MAIN ── */
.main{flex:1;overflow-y:auto;background:var(--bg)}

/* ── TABS ── */
.main-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;box-shadow:0 1px 0 var(--border)}
.main-tab{padding:0 18px;height:50px;display:inline-flex;align-items:center;font-size:.84rem;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s;user-select:none}
.main-tab.active{color:var(--red);border-color:var(--red)}

.panel{padding:18px}

/* ── ORDER CARD ── */
.order-group{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid var(--border)}
.og-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #F4F4F8;background:#FAFAFA}
.og-id{font-size:.8rem;font-weight:700;color:var(--dark)}
.og-time{font-size:.7rem;color:var(--sub);margin-top:2px}
.schip{font-size:.68rem;padding:4px 10px;border-radius:999px;font-weight:800}
.sc-p{background:#FEF2F2;color:var(--red)}
.sc-r{background:#FFFBEB;color:#92400E}
.sc-d{background:#ECFDF5;color:#065F46}
.del-btn{background:#F3F4F6;border:none;border-radius:8px;padding:5px 10px;font-size:.73rem;cursor:pointer;color:var(--sub);margin-left:7px;transition:background .15s;font-family:inherit}
.del-btn:hover{background:#E5E7EB;color:#374151}
.o-items{padding:4px 16px}
.o-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F4F4F8;font-size:.84rem}
.o-row:last-child{border:none}
.oqty{color:var(--red);font-weight:800;margin-right:6px}
.onote{margin:8px 16px;padding:8px 11px;background:#FFFBEB;border-radius:10px;font-size:.75rem;color:#92400E;border-left:3px solid #FDE68A}

/* ── BILL CARD ── */
.bill-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px;border:1px solid var(--border)}
.bill-card h3{font-size:.72rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
.bill-line{display:flex;justify-content:space-between;padding:7px 0;font-size:.86rem;border-bottom:1px solid #F4F4F8}
.bill-line.tax{color:var(--sub);font-size:.79rem}
.bill-line.grand{font-size:1.2rem;font-weight:900;color:var(--red);border:none;border-top:2px solid var(--red);padding-top:14px;margin-top:6px}

.action-bar{display:flex;gap:10px;margin-top:16px}
.abtn{flex:1;border:none;border-radius:14px;min-height:52px;font-size:.9rem;font-weight:800;cursor:pointer;transition:background .2s,transform .1s,box-shadow .2s;font-family:inherit}
.abtn:active{transform:scale(.98)}
.ab-pay{background:var(--green);color:white;box-shadow:0 4px 14px rgba(5,150,105,.28)}
.ab-pay:hover{background:#047857;box-shadow:0 6px 18px rgba(5,150,105,.36)}
.ab-print{background:#F3F4F6;color:#374151}
.ab-print:hover{background:#E5E7EB}

/* ── ALERTS ── */
.alert-box{border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.alert-bill{background:#FFFBEB;border:2px solid #FDE68A}
.alert-paid{background:#ECFDF5;border:2px solid #6EE7B7;animation:blink-g 1s infinite alternate}
@keyframes blink-g{from{background:#ECFDF5}to{background:#D1FAE5}}
.alert-bill-text{flex:1;font-size:.84rem;font-weight:700;color:#92400E}
.alert-paid-text{flex:1;font-size:.84rem;font-weight:700;color:#065F46}
.alert-label{font-size:.68rem;margin-top:3px;font-weight:600;opacity:.7}
.ba-btn{border:none;border-radius:10px;padding:0 16px;min-height:44px;font-size:.8rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:filter .15s,transform .1s;font-family:inherit}
.ba-btn:hover{filter:brightness(1.08)}
.ba-btn:active{transform:scale(.97)}
.ba-bill-btn{background:#B45309;color:white}
.ba-paid-btn{background:var(--green);color:white}

/* ── SALES ── */
.summary-bar{background:linear-gradient(135deg,#065F46,#059669);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 6px 24px rgba(5,150,105,.25)}
.summary-total{font-size:2.2rem;font-weight:900;color:#FFF;letter-spacing:-.5px}
.summary-sub{font-size:.8rem;color:rgba(255,255,255,.65);margin-top:4px}
.sale-card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.sc-tbl{font-size:.95rem;font-weight:800;color:var(--dark)}
.sc-paid{font-size:.7rem;color:var(--sub);margin-top:3px}
.sc-amount{font-size:1.1rem;font-weight:900;color:var(--green)}
.sc-items{font-size:.78rem;color:var(--sub);line-height:1.8;margin-top:8px;padding-top:8px;border-top:1px solid #F4F4F8}

/* ── EMPTY ── */
.empty-panel{text-align:center;padding:80px 20px;color:var(--sub)}
.empty-panel .icon{font-size:4rem;margin-bottom:12px;opacity:.5}

/* ── RECEIPT ── */
.receipt{display:none;font-family:'Courier New',monospace;font-size:.8rem;max-width:300px;margin:16px auto 0;padding:20px;border:1px dashed #D1D5DB;border-radius:10px;background:white}
.receipt.show{display:block}

/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.modal-bg.show{display:flex}
.modal{background:white;border-radius:22px;padding:26px;width:400px;max-width:94vw;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal h3{font-size:.95rem;font-weight:800;margin-bottom:18px;color:var(--dark)}
.frow{margin-bottom:13px}
.frow label{font-size:.74rem;color:var(--sub);display:block;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.frow input{width:100%;background:#F8F9FA;border:1.5px solid #E9ECEF;border-radius:12px;padding:10px 14px;min-height:46px;font-size:.88rem;outline:none;font-family:inherit;transition:border .2s,background .2s}
.frow input:focus{border-color:var(--red);background:white}
.mrow{display:flex;gap:10px;margin-top:16px}
.mrow button{flex:1;border:none;border-radius:12px;min-height:48px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s}
.mrow button:hover{filter:brightness(1.08)}

/* Spinner */
.spinner{width:18px;height:18px;border:2px solid #F0F0F0;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media print{header,nav,.sidebar,.main-tabs,.action-bar,button,.bill-card h3{display:none!important}.receipt{display:block!important;border:none}.layout{display:block}.main{padding:0;height:auto}.panel{padding:0}}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <div class="logo"><em>🧾</em> แคชเชียร์</div>
  <div class="hright">
    <span class="hclock" id="hclock"></span>
    <button class="icon-btn" onclick="fetchAll()">↺ รีเฟรช</button>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<nav>
  <a href="index.html">จัดการโต๊ะ</a>
  <a href="kitchen.html">ห้องครัว</a>
  <a href="admin.html" class="active">แคชเชียร์</a>
</nav>

<div class="layout">
  <!-- Sidebar: 10 fixed tables -->
  <div class="sidebar">
    <div class="sidebar-title">10 โต๊ะ</div>
    <div id="table-list"></div>
  </div>

  <!-- Main panel -->
  <div class="main">
    <div class="main-tabs">
      <div class="main-tab active" onclick="setMainTab('orders',this)">📋 ออเดอร์</div>
      <div class="main-tab" onclick="setMainTab('sales',this)">💰 ยอดขาย</div>
    </div>

    <div id="orders-panel">
      <div class="empty-panel"><div class="icon">👈</div><p>เลือกโต๊ะจากซ้ายมือ</p></div>
    </div>
    <div id="sales-panel" style="display:none"></div>
  </div>
</div>

<!-- Settings -->
<div class="modal-bg" id="settings-modal">
  <div class="modal">
    <h3>⚙️ GitHub Settings</h3>
    <div class="frow"><label>GitHub Username</label><input type="text" id="s-user"></div>
    <div class="frow"><label>Repository Name</label><input type="text" id="s-repo"></div>
    <div class="frow"><label>Personal Access Token</label><input type="password" id="s-token"></div>
    <div class="mrow">
      <button onclick="saveSettings()" style="background:var(--red);color:white">บันทึก</button>
      <button onclick="closeSettings()" style="background:#F2F2F7;color:var(--dark)">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
const TOTAL = 10;
let selectedTable = null;
let mainTab = 'orders';
let allOrders = [];

// ── Main tab ──
function setMainTab(tab, el) {
  mainTab = tab;
  document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('orders-panel').style.display = tab === 'orders' ? '' : 'none';
  document.getElementById('sales-panel').style.display = tab === 'sales' ? '' : 'none';
  if (tab === 'sales') renderSales();
}

// ── Fetch & render ──
async function fetchAll() {
  if (!DB.isReady()) {
    document.getElementById('table-list').innerHTML =
      '<div style="padding:14px;color:var(--red);font-size:.8rem">⚠️ ยังไม่ได้ตั้งค่า GitHub</div>';
    return;
  }
  try {
    allOrders = await DB.getOrders();
    renderSidebar();
    if (selectedTable !== null) renderOrderPanel();
  } catch(e) {
    document.getElementById('table-list').innerHTML =
      `<div style="padding:14px;color:var(--red);font-size:.8rem">❌ ${e.message}</div>`;
  }
}

function getTableStatus(t) {
  const tOrders = allOrders.filter(o => String(o.table) === String(t));
  if (!tOrders.length) return 'vacant';
  if (tOrders.some(o => o.type === 'payment_claimed')) return 'paid';
  if (tOrders.some(o => o.type === 'bill_request')) return 'bill';
  return 'busy';
}

function renderSidebar() {
  const list = document.getElementById('table-list');
  list.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) {
    const st = getTableStatus(i);
    const tOrders = allOrders.filter(o => String(o.table) === String(i) && o.type !== 'bill_request');
    const row = document.createElement('div');
    row.className = 'tbl-row' + (selectedTable == i ? ' active' : '');
    const pillClass = st === 'vacant' ? 'tp-vacant' : st === 'paid' ? 'tp-bill' : st === 'bill' ? 'tp-bill' : 'tp-busy';
    const pillText = st === 'vacant' ? 'ว่าง' : st === 'paid' ? '💰 จ่ายแล้ว' : st === 'bill' ? '🔔 ขอบิล' : `${tOrders.length} ออเดอร์`;
    row.innerHTML = `<span class="tbl-name">โต๊ะ ${i}</span><span class="tbl-pill ${pillClass}">${pillText}</span>`;
    row.onclick = () => { selectedTable = i; renderSidebar(); renderOrderPanel(); };
    list.appendChild(row);
  }
}

function renderOrderPanel() {
  const panel = document.getElementById('orders-panel');
  if (selectedTable === null) {
    panel.innerHTML = '<div class="empty-panel"><div class="icon">👈</div><p>เลือกโต๊ะจากซ้ายมือ</p></div>';
    return;
  }
  const specialTypes = ['bill_request','payment_claimed'];
  const orders = allOrders.filter(o => String(o.table) === String(selectedTable) && !specialTypes.includes(o.type))
    .sort((a, b) => a.timestamp - b.timestamp);
  const billReq = allOrders.find(o => String(o.table) === String(selectedTable) && o.type === 'bill_request');
  const paidClaim = allOrders.find(o => String(o.table) === String(selectedTable) && o.type === 'payment_claimed');

  if (!orders.length && !billReq && !paidClaim) {
    panel.innerHTML = '<div class="empty-panel"><div class="icon">🍽️</div><p>ไม่มีออเดอร์ในโต๊ะนี้</p></div>';
    return;
  }

  const subtotal = orders.reduce((s, o) => s + (o.subtotal || 0), 0);
  const svc = Math.round(subtotal * 10 / 100);
  const vat = Math.round((subtotal + svc) * 7 / 100);
  const grand = subtotal + svc + vat;

  const sMap = { pending: 'รอทำ', preparing: 'กำลังทำ', done: 'เสร็จแล้ว' };
  const cMap = { pending: 'sc-p', preparing: 'sc-r', done: 'sc-d' };

  const receiptLines = [
    `===== ร้านอาหาร Demo =====`,
    `โต๊ะ: ${selectedTable}`,
    `วันที่: ${new Date().toLocaleString('th-TH')}`,
    `--------------------------`,
    ...orders.flatMap(o => (o.items||[]).map(i =>
      `${i.name} ×${i.qty}`.padEnd(22) + `฿${(i.price*i.qty).toLocaleString().padStart(6)}`
    )),
    `--------------------------`,
    `อาหาร`.padEnd(22) + `฿${subtotal.toLocaleString().padStart(6)}`,
    `Service 10%`.padEnd(22) + `฿${svc.toLocaleString().padStart(6)}`,
    `VAT 7%`.padEnd(22) + `฿${vat.toLocaleString().padStart(6)}`,
    `==========================`,
    `รวมสุทธิ`.padEnd(20) + `฿${grand.toLocaleString().padStart(8)}`,
    `==========================`,
    `ขอบคุณที่ใช้บริการ 🙏`,
  ].join('\n');

  panel.innerHTML = `
    <div class="panel">
      ${paidClaim ? `
        <div class="alert-box alert-paid">
          <div style="font-size:1.6rem">💰</div>
          <div style="flex:1">
            <div class="alert-paid-text">ลูกค้าโอนเงินแล้ว — รอตรวจสอบ</div>
            <div class="alert-label" style="color:#065F46">โต๊ะ ${selectedTable} · ${paidClaim.time} · ฿${grand.toLocaleString()}</div>
          </div>
          <button class="ba-btn ba-paid-btn" onclick="confirmPayment()">✅ ยืนยัน</button>
        </div>` : ''}
      ${billReq && !paidClaim ? `
        <div class="alert-box alert-bill">
          <div style="font-size:1.6rem">🔔</div>
          <div style="flex:1">
            <div class="alert-bill-text">ลูกค้าขอบิล — ยังไม่ได้ชำระ</div>
            <div class="alert-label" style="color:#92400E">โต๊ะ ${selectedTable} · ${billReq.time} · ฿${grand.toLocaleString()}</div>
          </div>
          <button class="ba-btn ba-bill-btn" onclick="confirmPayment()">รับชำระ</button>
        </div>` : ''}

      ${orders.map(o => `
        <div class="order-group">
          <div class="og-head">
            <div><div class="og-id">ออเดอร์ …${o.id.slice(-6)}</div><div class="og-time">${o.time}</div></div>
            <div style="display:flex;align-items:center">
              <span class="schip ${cMap[o.status]}">${sMap[o.status]}</span>
              <button class="del-btn" onclick="delOrder('${o.id}')">✕</button>
            </div>
          </div>
          <div class="o-items">
            ${(o.items||[]).map(i => `<div class="o-row"><span><span class="oqty">×${i.qty}</span>${i.emoji||''} ${i.name}</span><span style="color:var(--sub)">฿${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}
          </div>
          ${o.note ? `<div class="onote">📝 ${o.note}</div>` : ''}
        </div>`).join('')}

      ${orders.length ? `
        <div class="bill-card">
          <h3>🧾 สรุปบิล — โต๊ะ ${selectedTable}</h3>
          <div class="bill-line"><span>ค่าอาหาร</span><span>฿${subtotal.toLocaleString()}</span></div>
          <div class="bill-line tax"><span>Service Charge 10%</span><span>฿${svc.toLocaleString()}</span></div>
          <div class="bill-line tax"><span>VAT 7%</span><span>฿${vat.toLocaleString()}</span></div>
          <div class="bill-line grand"><span>รวมสุทธิ</span><span>฿${grand.toLocaleString()}</span></div>
          <div class="action-bar">
            <button class="abtn ab-print" onclick="printBill()">🖨️ พิมพ์บิล</button>
            ${!billReq && !paidClaim ? `<button class="abtn ab-pay" onclick="confirmPayment()">💰 รับชำระเงิน</button>` : ''}
          </div>
        </div>` : ''}

      <div class="receipt" id="receipt-box"><pre>${receiptLines}</pre></div>
    </div>`;
}

let paying = false;
async function confirmPayment() {
  if (paying) return;
  if (!confirm(`ยืนยันรับชำระเงินโต๊ะ ${selectedTable}?\nออเดอร์จะถูกย้ายไปยังประวัติยอดขาย`)) return;
  paying = true;
  try {
    await DB.checkoutTable(selectedTable);
    selectedTable = null;
    await fetchAll();
    alert('✅ ชำระเงินสำเร็จ — บันทึกลง sales.json แล้ว');
  } catch(e) { alert('Error: ' + e.message); }
  finally { paying = false; }
}

async function delOrder(id) {
  if (!confirm('ลบออเดอร์นี้?')) return;
  try { await DB.deleteOrder(id); await fetchAll(); } catch(e) { alert(e.message); }
}

function printBill() {
  const r = document.getElementById('receipt-box');
  if (r) { r.classList.add('show'); window.print(); r.classList.remove('show'); }
}

// ── Sales panel ──
async function renderSales() {
  const panel = document.getElementById('sales-panel');
  panel.innerHTML = '<div style="padding:24px;text-align:center"><span class="spinner"></span></div>';
  if (!DB.isReady()) { panel.innerHTML = '<div style="padding:20px;color:var(--red)">⚠️ ยังไม่ได้ตั้งค่า</div>'; return; }
  try {
    const sales = await DB.getSales();
    if (!sales.length) {
      panel.innerHTML = '<div class="empty-panel"><div class="icon">💰</div><p>ยังไม่มีประวัติยอดขาย</p></div>';
      return;
    }
    const grandTotal = sales.reduce((s, x) => s + (x.total || 0), 0);
    const sorted = [...sales].sort((a, b) => b.timestamp - a.timestamp);
    panel.innerHTML = `
      <div class="panel">
        <div class="summary-bar">
          <div class="summary-total">฿${grandTotal.toLocaleString()}</div>
          <div class="summary-sub">รายได้รวมทั้งหมด · ${sales.length} session · ${sales.reduce((s,x)=>s+(x.orders||[]).length,0)} ออเดอร์</div>
        </div>
        ${sorted.map(s => `
          <div class="sale-card">
            <div class="sc-head">
              <div>
                <div class="sc-tbl">🪑 โต๊ะ ${s.table}</div>
                <div class="sc-paid">${s.paidAt} · ${(s.orders||[]).length} ออเดอร์</div>
              </div>
              <div class="sc-amount">฿${(s.total||0).toLocaleString()}</div>
            </div>
            <div class="sc-items">
              ${(s.orders||[]).flatMap(o=>(o.items||[]).map(i=>`${i.emoji||''}${i.name} ×${i.qty}`)).join(' · ')}
            </div>
          </div>`).join('')}
      </div>`;
  } catch(e) {
    panel.innerHTML = `<div style="padding:20px;color:var(--red)">❌ ${e.message}</div>`;
  }
}

// ── Settings ──
function openSettings() {
  const c = DB.cfg();
  document.getElementById('s-user').value = c.user;
  document.getElementById('s-repo').value = c.repo;
  document.getElementById('s-token').value = c.token;
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
async function saveSettings() {
  DB.saveConfig(document.getElementById('s-user').value, document.getElementById('s-repo').value, document.getElementById('s-token').value);
  closeSettings();
  await fetchAll();
}

setInterval(() => { document.getElementById('hclock').textContent = new Date().toLocaleTimeString('th-TH'); }, 1000);
document.getElementById('hclock').textContent = new Date().toLocaleTimeString('th-TH');

fetchAll();
setInterval(fetchAll, 8000);
</script>
