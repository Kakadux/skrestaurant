<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้องครัว</title>
<script src="js/db.js"></script>
<style>
:root{--red:#C41E3A;--orange:#FF9500;--green:#34C759;--blue:#0A84FF;--dark:#1C1C1E;--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--sub:#8E8E93;--border:#3A3A3C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:white;min-height:100vh}

header{background:#111;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.1rem;font-weight:800;color:white}.logo em{color:var(--red);font-style:normal}
.header-right{display:flex;align-items:center;gap:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.clock{font-size:.88rem;color:var(--sub);font-variant-numeric:tabular-nums}
nav{background:#111;border-bottom:1px solid var(--border);display:flex}
nav a{color:var(--sub);text-decoration:none;padding:10px 18px;font-size:.8rem;transition:all .2s;border-bottom:2px solid transparent}
nav a:hover{color:white}
nav a.active{color:var(--red);border-color:var(--red)}

/* Stats bar */
.stats{display:flex;background:#111;border-bottom:1px solid var(--border);padding:12px 20px;gap:24px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-val{font-size:1.4rem;font-weight:800}
.stat-label{font-size:.7rem;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.c-pending{color:var(--red)}.c-prep{color:var(--orange)}.c-done{color:var(--green)}

/* Tabs */
.tabs{display:flex;background:#111;border-bottom:1px solid var(--border);padding:0 16px;gap:4px}
.tab{padding:10px 16px;font-size:.82rem;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;user-select:none}
.tab:hover{color:white}
.tab.active{color:white;border-color:white}

/* Sync bar */
.sync-bar{background:#111;padding:6px 20px;font-size:.72rem;color:var(--sub);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
#sync-status{font-weight:700}
#sync-status.ok{color:var(--green)}
#sync-status.err{color:var(--red)}

/* Board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}

/* Bill request card — prominent */
.order-card.bill-card{border:2px solid var(--red);background:#2A0A0E;animation:blink-card 1.5s infinite}
@keyframes blink-card{0%,100%{border-color:var(--red)}50%{border-color:#FF453A;box-shadow:0 0 16px rgba(196,30,58,.4)}}
.order-card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);transition:transform .2s}
.order-card.preparing{border-color:var(--orange)}
.order-card.done{border-color:var(--border);opacity:.5}

.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.tbl-badge{font-size:1rem;font-weight:900;padding:4px 14px;border-radius:8px;letter-spacing:.3px}
.tb-pending{background:var(--red);color:white}
.tb-preparing{background:var(--orange);color:white}
.tb-done{background:#3A3A3C;color:var(--sub)}
.tb-bill{background:var(--red);color:white}
.otime{font-size:.72rem;color:var(--sub)}

.item-list{margin-bottom:11px}
.irow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:.84rem;color:rgba(255,255,255,.8)}
.irow:last-child{border:none}
.iqty{background:rgba(255,255,255,.12);color:rgba(255,255,255,.6);font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px}
.note-box{background:rgba(255,204,0,.08);border:1px solid rgba(255,204,0,.2);border-radius:8px;padding:6px 10px;font-size:.78rem;color:#FFCC00;margin-bottom:10px}

.bill-notice{text-align:center;padding:10px 0;font-size:.92rem;font-weight:800;color:var(--red)}

.acts{display:flex;gap:7px}
.act-btn{flex:1;border:none;border-radius:9px;padding:9px;font-size:.8rem;font-weight:800;cursor:pointer;transition:opacity .2s}
.act-btn:hover{opacity:.85}
.ab-prep{background:var(--orange);color:white}
.ab-done{background:var(--green);color:white}
.ab-del{background:var(--card2);color:var(--sub)}

.empty{text-align:center;padding:80px 20px;color:var(--sub);grid-column:1/-1}
.empty .icon{font-size:3.5rem;margin-bottom:12px}

/* Settings modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:#2C2C2E;border-radius:16px;padding:24px;width:360px;max-width:94vw;border:1px solid var(--border)}
.modal h3{font-size:.95rem;font-weight:800;color:white;margin-bottom:16px}
.frow{margin-bottom:11px}
.frow label{font-size:.75rem;color:var(--sub);display:block;margin-bottom:4px;font-weight:600}
.frow input{width:100%;background:#1C1C1E;border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:white;font-size:.88rem;outline:none}
.frow input:focus{border-color:var(--red)}
.mrow{display:flex;gap:8px;margin-top:14px}
.mrow button{flex:1;border:none;border-radius:9px;padding:10px;font-size:.85rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo"><em>👨‍🍳</em> จอครัว</div>
  <div class="header-right">
    <span class="live-dot"></span>
    <span id="sync-status" class="ok">Live</span>
    <span class="clock" id="clock">00:00:00</span>
    <button onclick="openSettings()" style="background:#2C2C2E;color:#aaa;border:1px solid #3A3A3C;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.8rem">⚙️</button>
  </div>
</header>

<nav>
  <a href="index.html">จัดการโต๊ะ</a>
  <a href="kitchen.html" class="active">ห้องครัว</a>
  <a href="admin.html">แคชเชียร์</a>
</nav>

<div class="stats">
  <div class="stat"><span class="stat-val c-pending" id="cp">0</span><span class="stat-label">รอทำ</span></div>
  <div class="stat"><span class="stat-val c-prep" id="cr">0</span><span class="stat-label">กำลังทำ</span></div>
  <div class="stat"><span class="stat-val c-done" id="cd">0</span><span class="stat-label">เสร็จแล้ว</span></div>
  <div class="stat" style="margin-left:auto"><span class="stat-val" style="color:#FF453A" id="cb">0</span><span class="stat-label">รอชำระเงิน</span></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="setTab('all',this)">ทั้งหมด</div>
  <div class="tab" onclick="setTab('pending',this)">รอทำ</div>
  <div class="tab" onclick="setTab('preparing',this)">กำลังทำ</div>
  <div class="tab" onclick="setTab('done',this)">เสร็จ</div>
  <div class="tab" onclick="setTab('bill_request',this)">💰 รอชำระ</div>
</div>

<div class="sync-bar"><span>ซิงค์ล่าสุด: <span id="last-sync">—</span></span></div>
<div class="board" id="board"></div>

<!-- Settings -->
<div class="modal-bg" id="settings-modal">
  <div class="modal">
    <h3>⚙️ GitHub Settings</h3>
    <div class="frow"><label>GitHub Username</label><input type="text" id="s-user"></div>
    <div class="frow"><label>Repository Name</label><input type="text" id="s-repo"></div>
    <div class="frow"><label>Personal Access Token</label><input type="password" id="s-token"></div>
    <div class="mrow">
      <button onclick="saveSettings()" style="background:var(--red);color:white">บันทึก</button>
      <button onclick="closeSettings()" style="background:#3A3A3C;color:#aaa">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'all';
let prevPending = -1;

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  fetchAndRender();
}

async function fetchAndRender() {
  const ss = document.getElementById('sync-status');
  if (!DB.isReady()) {
    ss.textContent = '⚠️ ไม่ได้ตั้งค่า'; ss.className = 'err';
    renderBoard([]);
    return;
  }
  try {
    const orders = await DB.getOrders();
    document.getElementById('last-sync').textContent = new Date().toLocaleTimeString('th-TH');
    ss.textContent = 'Live'; ss.className = 'ok';
    renderBoard(orders);
  } catch(e) {
    ss.textContent = '❌ ' + e.message; ss.className = 'err';
  }
}

function renderBoard(all) {
  all.sort((a, b) => a.timestamp - b.timestamp);
  const pending = all.filter(o => o.status === 'pending' && o.type !== 'bill_request');
  const preparing = all.filter(o => o.status === 'preparing');
  const done = all.filter(o => o.status === 'done');
  const bills = all.filter(o => o.type === 'bill_request');

  document.getElementById('cp').textContent = pending.length;
  document.getElementById('cr').textContent = preparing.length;
  document.getElementById('cd').textContent = done.length;
  document.getElementById('cb').textContent = bills.length;

  if (prevPending >= 0 && pending.length > prevPending) {
    document.title = `🔔 ออเดอร์ใหม่ (${pending.length}) — ห้องครัว`;
    setTimeout(() => document.title = '👨‍🍳 ห้องครัว', 4000);
  }
  if (bills.length > 0 && prevPending >= 0) {
    // Flash title for bill requests too
  }
  prevPending = pending.length;

  let list;
  if (currentTab === 'pending') list = pending;
  else if (currentTab === 'preparing') list = preparing;
  else if (currentTab === 'done') list = done;
  else if (currentTab === 'bill_request') list = bills;
  else list = [...bills, ...pending, ...preparing, ...done];

  const board = document.getElementById('board');
  board.innerHTML = '';
  if (!list.length) {
    board.innerHTML = '<div class="empty"><div class="icon">🍳</div><p>ไม่มีออเดอร์ในหมวดนี้</p></div>';
    return;
  }

  list.forEach(order => {
    const isBill = order.type === 'bill_request';
    const card = document.createElement('div');
    card.className = `order-card ${isBill ? 'bill-card' : order.status}`;

    if (isBill) {
      card.innerHTML = `
        <div class="card-top">
          <span class="tbl-badge tb-bill">🔔 โต๊ะ ${order.table}</span>
          <span class="otime">${order.time}</span>
        </div>
        <div class="bill-notice">💰 ลูกค้าเรียกเก็บเงินแล้ว!</div>
        <div class="acts">
          <button class="act-btn ab-del" onclick="act('${order.id}','delete')">✕ ลบ</button>
        </div>`;
    } else {
      const badgeClass = order.status === 'pending' ? 'tb-pending' : order.status === 'preparing' ? 'tb-preparing' : 'tb-done';
      const acts = order.status === 'pending'
        ? `<button class="act-btn ab-prep" onclick="act('${order.id}','preparing')">🔥 เริ่มทำ</button>
           <button class="act-btn ab-del" onclick="act('${order.id}','delete')">✕</button>`
        : order.status === 'preparing'
        ? `<button class="act-btn ab-done" onclick="act('${order.id}','done')">✅ เสร็จ</button>
           <button class="act-btn ab-del" onclick="act('${order.id}','delete')">✕</button>`
        : `<button class="act-btn ab-del" onclick="act('${order.id}','delete')" style="flex:1">🗑️ ลบ</button>`;

      card.innerHTML = `
        <div class="card-top">
          <span class="tbl-badge ${badgeClass}">โต๊ะ ${order.table}</span>
          <span class="otime">${order.time} · ฿${order.total?.toLocaleString()}</span>
        </div>
        <div class="item-list">
          ${order.items.map(i => `<div class="irow"><span><span class="iqty">×${i.qty}</span>${i.emoji || ''} ${i.name}</span><span style="color:#8E8E93">฿${(i.price*i.qty).toLocaleString()}</span></div>`).join('')}
        </div>
        ${order.note ? `<div class="note-box">📝 ${order.note}</div>` : ''}
        <div class="acts">${acts}</div>`;
    }
    board.appendChild(card);
  });
}

async function act(id, action) {
  if (!DB.isReady()) return alert('ยังไม่ได้ตั้งค่า GitHub');
  try {
    if (action === 'delete') await DB.deleteOrder(id);
    else await DB.patchOrder(id, { status: action });
    await fetchAndRender();
  } catch(e) { alert('Error: ' + e.message); }
}

function openSettings() {
  const c = DB.cfg();
  document.getElementById('s-user').value = c.user;
  document.getElementById('s-repo').value = c.repo;
  document.getElementById('s-token').value = c.token;
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
function saveSettings() {
  DB.saveConfig(document.getElementById('s-user').value, document.getElementById('s-repo').value, document.getElementById('s-token').value);
  closeSettings(); fetchAndRender();
}

// Clock
setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('th-TH'); }, 1000);
document.getElementById('clock').textContent = new Date().toLocaleTimeString('th-TH');

fetchAndRender();
setInterval(fetchAndRender, 6000);
</script>
</body>
</html>
