<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ห้องครัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="js/db.js"></script>
<style>
:root{
  --red:#FF453A;--orange:#FF9F0A;--green:#30D158;--dark:#1C1C1E;
  --bg:#0D0D0F;--card:#1C1C1E;--card2:#2C2C2E;--card3:#3A3A3C;
  --sub:#8E8E93;--border:rgba(255,255,255,.08);
  --shadow-card:0 4px 20px rgba(0,0,0,.4);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:white;min-height:100vh}

/* ── HEADER ── */
header{
  background:rgba(28,28,30,.95);
  border-bottom:1px solid var(--border);
  padding:0 20px;height:56px;
  display:flex;justify-content:space-between;align-items:center;
  backdrop-filter:blur(16px);position:sticky;top:0;z-index:90;
}
.logo{font-size:1.05rem;font-weight:800;color:white;display:flex;align-items:center;gap:8px}
.logo-icon{font-size:1.3rem}
.header-right{display:flex;align-items:center;gap:10px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 6px var(--green)}50%{opacity:.5;box-shadow:0 0 12px var(--green)}}
.clock{font-size:.85rem;color:var(--sub);font-variant-numeric:tabular-nums;background:var(--card2);padding:5px 10px;border-radius:8px}
.settings-btn{background:var(--card2);color:var(--sub);border:1px solid var(--border);border-radius:10px;padding:0 12px;height:36px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:4px;transition:background .2s}
.settings-btn:hover{background:var(--card3);color:white}

/* ── NAV ── */
nav{background:rgba(17,17,19,.95);border-bottom:1px solid var(--border);display:flex;backdrop-filter:blur(8px)}
nav a{color:var(--sub);text-decoration:none;padding:0 18px;height:44px;display:inline-flex;align-items:center;font-size:.8rem;font-weight:600;transition:color .2s;border-bottom:2px solid transparent}
nav a:hover{color:rgba(255,255,255,.7)}
nav a.active{color:var(--red);border-color:var(--red)}

/* ── STATS BAR ── */
.stats{
  display:flex;
  background:rgba(28,28,30,.8);
  border-bottom:1px solid var(--border);
  padding:14px 20px;gap:0;
}
.stat{
  display:flex;flex-direction:column;gap:3px;
  padding:0 20px;border-right:1px solid var(--border);
}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:none;margin-left:auto;padding-right:0}
.stat-val{font-size:1.6rem;font-weight:900;line-height:1}
.stat-label{font-size:.65rem;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.c-pending{color:var(--red)}.c-prep{color:var(--orange)}.c-done{color:var(--green)}.c-bill{color:#FF6B6B}

/* ── TABS ── */
.tabs{display:flex;background:rgba(17,17,19,.9);border-bottom:1px solid var(--border);padding:0 16px;gap:0;overflow-x:auto}
.tab{
  padding:0 18px;height:44px;display:inline-flex;align-items:center;gap:6px;
  font-size:.8rem;font-weight:700;color:var(--sub);cursor:pointer;
  border-bottom:2px solid transparent;transition:color .2s;user-select:none;white-space:nowrap;
}
.tab:hover{color:rgba(255,255,255,.7)}
.tab.active{color:white;border-color:white}
.tab-count{
  font-size:.65rem;font-weight:800;padding:1px 6px;border-radius:6px;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.5);
}
.tab.active .tab-count{background:rgba(255,255,255,.2);color:white}

/* ── SYNC BAR ── */
.sync-bar{
  background:rgba(28,28,30,.6);padding:6px 20px;
  font-size:.7rem;color:var(--sub);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
#sync-status{font-weight:700}
#sync-status.ok{color:var(--green)}
#sync-status.err{color:var(--red)}

/* ── BOARD ── */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding:18px}

/* ── ORDER CARDS ── */
.order-card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  border:1px solid var(--border);
  box-shadow:var(--shadow-card);
  transition:transform .2s,box-shadow .2s;
}
.order-card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.order-card.preparing{border-color:rgba(255,159,10,.35);background:linear-gradient(160deg,#1C1C1E,#221A0A)}
.order-card.done{opacity:.45;filter:grayscale(.3)}
.order-card.bill-card{
  border:2px solid rgba(255,69,58,.5);
  background:linear-gradient(160deg,#200A0A,#1C1C1E);
  animation:blink-card 1.8s infinite;
}
@keyframes blink-card{
  0%,100%{border-color:rgba(255,69,58,.5);box-shadow:0 0 0 rgba(255,69,58,0)}
  50%{border-color:var(--red);box-shadow:0 0 20px rgba(255,69,58,.25)}
}

/* ── CARD HEADER ── */
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tbl-badge{
  font-size:.95rem;font-weight:900;padding:5px 14px;
  border-radius:10px;letter-spacing:.2px;display:flex;align-items:center;gap:5px;
}
.tb-pending{background:rgba(255,69,58,.2);color:var(--red);border:1px solid rgba(255,69,58,.3)}
.tb-preparing{background:rgba(255,159,10,.2);color:var(--orange);border:1px solid rgba(255,159,10,.3)}
.tb-done{background:rgba(255,255,255,.07);color:var(--sub);border:1px solid var(--border)}
.tb-bill{background:rgba(255,69,58,.25);color:var(--red);border:1px solid rgba(255,69,58,.4)}
.otime{font-size:.7rem;color:var(--sub);background:rgba(255,255,255,.05);padding:4px 8px;border-radius:6px}

/* ── ITEMS ── */
.item-list{margin-bottom:12px;background:rgba(0,0,0,.2);border-radius:12px;overflow:hidden}
.irow{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:.84rem;color:rgba(255,255,255,.85);
}
.irow:last-child{border:none}
.irow-left{display:flex;align-items:center;gap:6px}
.iqty{
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);
  font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:5px;
}
.iprice{color:var(--sub);font-size:.78rem}

.note-box{
  background:rgba(255,204,0,.07);border:1px solid rgba(255,204,0,.18);
  border-radius:10px;padding:8px 12px;font-size:.78rem;color:#FFD60A;
  margin-bottom:12px;display:flex;align-items:flex-start;gap:6px;
}

.bill-notice{
  text-align:center;padding:14px 0 10px;
  font-size:1rem;font-weight:800;color:var(--red);
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.bill-notice small{font-size:.72rem;color:var(--sub);font-weight:400}

/* ── ACTION BUTTONS ── */
.acts{display:flex;gap:8px;margin-top:2px}
.act-btn{
  flex:1;border:none;border-radius:12px;min-height:44px;
  font-size:.82rem;font-weight:800;cursor:pointer;
  transition:filter .15s,transform .1s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.act-btn:hover{filter:brightness(1.15)}
.act-btn:active{transform:scale(.97)}
.ab-prep{background:linear-gradient(135deg,var(--orange),#E8880A);color:white;box-shadow:0 3px 12px rgba(255,159,10,.3)}
.ab-done{background:linear-gradient(135deg,var(--green),#28BC50);color:white;box-shadow:0 3px 12px rgba(48,209,88,.3)}
.ab-del{background:rgba(255,255,255,.07);color:var(--sub);border:1px solid var(--border)}

.empty{text-align:center;padding:80px 20px;color:var(--sub);grid-column:1/-1}
.empty .icon{font-size:3.5rem;margin-bottom:14px;display:block;opacity:.5}
.empty p{font-size:.9rem}

/* ── SETTINGS MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal-bg.show{display:flex}
.modal{background:#1C1C1E;border-radius:22px;padding:26px;width:360px;max-width:94vw;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{font-size:.9rem;font-weight:800;color:white;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.frow{margin-bottom:12px}
.frow label{font-size:.68rem;font-weight:800;color:var(--sub);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.frow input{
  width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);
  border-radius:11px;padding:10px 14px;color:white;font-size:.88rem;outline:none;
  font-family:inherit;transition:border .2s,background .2s;
}
.frow input:focus{border-color:var(--red);background:rgba(255,255,255,.07)}
.mrow{display:flex;gap:8px;margin-top:18px}
.mrow button{
  flex:1;border:none;border-radius:12px;min-height:46px;
  font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s;
}
.mrow button:hover{filter:brightness(1.1)}

@media(max-width:600px){
  .stats{gap:12px;flex-wrap:wrap}
  .stat{padding:0 12px}
  .board{grid-template-columns:1fr;padding:12px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-icon">👨‍🍳</span> จอครัว</div>
  <div class="header-right">
    <span class="live-dot"></span>
    <span id="sync-status" class="ok" style="font-size:.78rem;font-weight:700">Live</span>
    <span class="clock" id="clock">00:00:00</span>
    <button class="settings-btn" onclick="openSettings()">⚙️ ตั้งค่า</button>
  </div>
</header>

<nav>
  <a href="index.html">จัดการโต๊ะ</a>
  <a href="kitchen.html" class="active">ห้องครัว</a>
  <a href="admin.html">แคชเชียร์</a>
</nav>

<div class="stats">
  <div class="stat"><span class="stat-val c-pending" id="cp">0</span><span class="stat-label">รอทำ</span></div>
  <div class="stat"><span class="stat-val c-prep" id="cr">0</span><span class="stat-label">กำลังทำ</span></div>
  <div class="stat"><span class="stat-val c-done" id="cd">0</span><span class="stat-label">เสร็จแล้ว</span></div>
  <div class="stat"><span class="stat-val c-bill" id="cb">0</span><span class="stat-label">รอชำระเงิน</span></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="setTab('all',this)">ทั้งหมด <span class="tab-count" id="tc-all">0</span></div>
  <div class="tab" onclick="setTab('pending',this)">รอทำ <span class="tab-count" id="tc-pending">0</span></div>
  <div class="tab" onclick="setTab('preparing',this)">กำลังทำ <span class="tab-count" id="tc-prep">0</span></div>
  <div class="tab" onclick="setTab('done',this)">เสร็จ <span class="tab-count" id="tc-done">0</span></div>
  <div class="tab" onclick="setTab('bill_request',this)">💰 รอชำระ <span class="tab-count" id="tc-bill">0</span></div>
</div>

<div class="sync-bar"><span>ซิงค์ล่าสุด: <span id="last-sync">—</span></span></div>
<div class="board" id="board"></div>

<!-- Settings -->
<div class="modal-bg" id="settings-modal">
  <div class="modal">
    <h3>⚙️ GitHub Settings</h3>
    <div class="frow"><label>GitHub Username</label><input type="text" id="s-user"></div>
    <div class="frow"><label>Repository Name</label><input type="text" id="s-repo"></div>
    <div class="frow"><label>Personal Access Token</label><input type="password" id="s-token"></div>
    <div class="mrow">
      <button onclick="saveSettings()" style="background:var(--red);color:white">บันทึก</button>
      <button onclick="closeSettings()" style="background:#3A3A3C;color:#aaa">ยกเลิก</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'all';
let prevPending = -1;

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  fetchAndRender();
}

async function fetchAndRender() {
  const ss = document.getElementById('sync-status');
  if (!DB.isReady()) {
    ss.textContent = '⚠️ ไม่ได้ตั้งค่า'; ss.className = 'err';
    renderBoard([]);
    return;
  }
  try {
    const orders = await DB.getOrders();
    document.getElementById('last-sync').textContent = new Date().toLocaleTimeString('th-TH');
    ss.textContent = 'Live'; ss.className = 'ok';
    renderBoard(orders);
  } catch(e) {
    ss.textContent = '❌ ' + e.message; ss.className = 'err';
  }
}

function renderBoard(all) {
  all.sort((a, b) => a.timestamp - b.timestamp);
  const pending = all.filter(o => o.status === 'pending' && o.type !== 'bill_request');
  const preparing = all.filter(o => o.status === 'preparing');
  const done = all.filter(o => o.status === 'done');
  const bills = all.filter(o => o.type === 'bill_request');

  document.getElementById('cp').textContent = pending.length;
  document.getElementById('cr').textContent = preparing.length;
  document.getElementById('cd').textContent = done.length;
  document.getElementById('cb').textContent = bills.length;

  const allCount = bills.length + pending.length + preparing.length + done.length;
  document.getElementById('tc-all').textContent = allCount;
  document.getElementById('tc-pending').textContent = pending.length;
  document.getElementById('tc-prep').textContent = preparing.length;
  document.getElementById('tc-done').textContent = done.length;
  document.getElementById('tc-bill').textContent = bills.length;

  if (prevPending >= 0 && pending.length > prevPending) {
    document.title = `🔔 ออเดอร์ใหม่ (${pending.length}) — ห้องครัว`;
    setTimeout(() => document.title = '👨‍🍳 ห้องครัว', 4000);
  }
  prevPending = pending.length;

  let list;
  if (currentTab === 'pending') list = pending;
  else if (currentTab === 'preparing') list = preparing;
  else if (currentTab === 'done') list = done;
  else if (currentTab === 'bill_request') list = bills;
  else list = [...bills, ...pending, ...preparing, ...done];

  const board = document.getElementById('board');
  board.innerHTML = '';
  if (!list.length) {
    board.innerHTML = '<div class="empty"><span class="icon">🍳</span><p>ไม่มีออเดอร์ในหมวดนี้</p></div>';
    return;
  }

  list.forEach(order => {
    const isBill = order.type === 'bill_request';
    const card = document.createElement('div');
    card.className = `order-card ${isBill ? 'bill-card' : order.status}`;

    if (isBill) {
      card.innerHTML = `
        <div class="card-top">
          <span class="tbl-badge tb-bill">🔔 โต๊ะ ${order.table}</span>
          <span class="otime">${order.time}</span>
        </div>
        <div class="bill-notice">💰 ลูกค้าเรียกเก็บเงินแล้ว!<small>กรุณาแจ้งแคชเชียร์</small></div>
        <div class="acts">
          <button class="act-btn ab-del" onclick="act('${order.id}','delete')">✕ รับทราบ</button>
        </div>`;
    } else {
      const badgeClass = order.status === 'pending' ? 'tb-pending' : order.status === 'preparing' ? 'tb-preparing' : 'tb-done';
      const statusLabel = order.status === 'pending' ? '🔴 รอทำ' : order.status === 'preparing' ? '🟠 กำลังทำ' : '🟢 เสร็จ';
      const acts = order.status === 'pending'
        ? `<button class="act-btn ab-prep" onclick="act('${order.id}','preparing')">🔥 เริ่มทำ</button>
           <button class="act-btn ab-del" onclick="act('${order.id}','delete')" style="flex:0;padding:0 14px">✕</button>`
        : order.status === 'preparing'
        ? `<button class="act-btn ab-done" onclick="act('${order.id}','done')">✅ เสร็จแล้ว</button>
           <button class="act-btn ab-del" onclick="act('${order.id}','delete')" style="flex:0;padding:0 14px">✕</button>`
        : `<button class="act-btn ab-del" onclick="act('${order.id}','delete')">🗑️ ลบออก</button>`;

      card.innerHTML = `
        <div class="card-top">
          <span class="tbl-badge ${badgeClass}">โต๊ะ ${order.table}</span>
          <span class="otime">${order.time} · ฿${order.total?.toLocaleString()}</span>
        </div>
        <div class="item-list">
          ${order.items.map(i => `
            <div class="irow">
              <div class="irow-left"><span class="iqty">×${i.qty}</span>${i.emoji || ''} ${i.name}</div>
              <span class="iprice">฿${(i.price*i.qty).toLocaleString()}</span>
            </div>`).join('')}
        </div>
        ${order.note ? `<div class="note-box">📝 <span>${order.note}</span></div>` : ''}
        <div class="acts">${acts}</div>`;
    }
    board.appendChild(card);
  });
}

async function act(id, action) {
  if (!DB.isReady()) return alert('ยังไม่ได้ตั้งค่า GitHub');
  try {
    if (action === 'delete') await DB.deleteOrder(id);
    else await DB.patchOrder(id, { status: action });
    await fetchAndRender();
  } catch(e) { alert('Error: ' + e.message); }
}

function openSettings() {
  const c = DB.cfg();
  document.getElementById('s-user').value = c.user;
  document.getElementById('s-repo').value = c.repo;
  document.getElementById('s-token').value = c.token;
  document.getElementById('settings-modal').classList.add('show');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('show'); }
function saveSettings() {
  DB.saveConfig(document.getElementById('s-user').value, document.getElementById('s-repo').value, document.getElementById('s-token').value);
  closeSettings(); fetchAndRender();
}

// Clock
setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('th-TH'); }, 1000);
document.getElementById('clock').textContent = new Date().toLocaleTimeString('th-TH');

fetchAndRender();
setInterval(fetchAndRender, 6000);
</script>
</body>
</html>
