<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการโต๊ะ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/db.js"></script>
<style>
:root{--red:#C41E3A;--dark:#1C1C1E;--bg:#F2F2F7;--card:#FFF;--sub:#8E8E93;--green:#34C759;--orange:#FF9500;--yellow:#FFCC00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--dark)}

header{background:var(--dark);color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:.3px}
.logo span{color:#FF453A}
header nav{display:flex;gap:6px}
nav a{color:rgba(255,255,255,.55);text-decoration:none;font-size:.78rem;padding:6px 12px;border-radius:8px;transition:all .2s}
nav a:hover,nav a.active{background:rgba(255,255,255,.12);color:white}
nav a.active{color:#FF453A}

/* Status bar */
.status-bar{padding:10px 20px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:7px}
.status-bar.ok{background:#D1FAE5;color:#065F46}
.status-bar.err{background:#FEE2E2;color:#991B1B}
.status-bar.warn{background:#FEF3C7;color:#92400E}
.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

.container{max-width:1000px;margin:0 auto;padding:20px 16px}

/* Config card */
.config-card{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.config-card h2{font-size:.8rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;margin-bottom:14px}
.cfg-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfg-row label{font-size:.82rem;color:var(--sub);min-width:60px}
input[type=text],input[type=password]{background:#F2F2F7;border:1.5px solid transparent;border-radius:10px;padding:8px 12px;font-size:.88rem;outline:none;color:var(--dark);transition:border .2s}
input:focus{border-color:var(--red);background:white}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:.83rem;font-weight:700;cursor:pointer;transition:background .2s}
.btn-red{background:var(--red);color:white}.btn-red:hover{background:#991B1B}
.btn-dark{background:var(--dark);color:white}.btn-dark:hover{background:#3A3A3C}
.btn-gray{background:#E5E5EA;color:var(--dark)}.btn-gray:hover{background:#D1D1D6}
.btn-green{background:var(--green);color:white}

/* Tables section */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-header h2{font-size:1rem;font-weight:800}
.section-header small{font-size:.75rem;color:var(--sub)}

.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tbl-card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.07);border:2px solid transparent;transition:border .3s;cursor:pointer}
.tbl-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tbl-card.available{border-color:#D1FAE5}
.tbl-card.occupied{border-color:#FED7AA}
.tbl-card.bill{border-color:#FCA5A5;animation:pulse-border 1.5s infinite}
@keyframes pulse-border{0%,100%{border-color:#FCA5A5}50%{border-color:var(--red)}}

.tbl-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.tbl-num{font-size:1.5rem;font-weight:900;color:var(--dark)}
.status-pill{font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px}
.sp-available{background:#D1FAE5;color:#065F46}
.sp-occupied{background:#FEF3C7;color:#92400E}
.sp-bill{background:#FEE2E2;color:var(--red)}

.qr-area{display:flex;justify-content:center;margin-bottom:10px;min-height:100px;align-items:center}
.qr-placeholder{width:100px;height:100px;background:#F2F2F7;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#C7C7CC;font-size:.75rem;text-align:center;padding:8px}

.tbl-footer{font-size:.72rem;color:var(--sub);text-align:center}
.order-count{color:var(--red);font-weight:700}

/* Print */
@media print{
  header,.status-bar,.config-card,.section-header .btn,body>*:not(.container){display:none!important}
  .tbl-card{page-break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  body{background:white}
  .tbl-footer{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">🍜 <span>ร้านอาหาร</span> Demo</div>
  <nav>
    <a href="index.html" class="active">จัดการโต๊ะ</a>
    <a href="kitchen.html">ห้องครัว</a>
    <a href="admin.html">แคชเชียร์</a>
  </nav>
</header>

<div class="status-bar warn" id="status-bar">
  <span class="status-dot"></span>
  <span id="status-msg">กำลังตรวจสอบการเชื่อมต่อ…</span>
</div>

<div class="container">
  <!-- GitHub Config -->
  <div class="config-card">
    <h2>⚙️ การตั้งค่า GitHub Storage</h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="cfg-row">
        <label>Username</label>
        <input type="text" id="s-user" placeholder="your-username" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>Repository</label>
        <input type="text" id="s-repo" placeholder="restaurant-demo" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>Token</label>
        <input type="password" id="s-token" placeholder="ghp_xxxxxxxxxxxx" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>PromptPay</label>
        <input type="text" id="s-pp" placeholder="0812345678" style="flex:1">
        <span style="font-size:.75rem;color:var(--sub)">เบอร์โทร/เลขบัตร</span>
      </div>
      <div class="cfg-row">
        <button class="btn btn-red" onclick="saveAndTest()">บันทึก &amp; ทดสอบ</button>
        <button class="btn btn-gray" onclick="window.print()">🖨️ พิมพ์ QR</button>
        <button class="btn btn-dark" onclick="clearOrders()">🗑️ ล้างออเดอร์ทั้งหมด</button>
      </div>
    </div>
  </div>

  <!-- Tables -->
  <div class="section-header">
    <h2>🪑 10 โต๊ะ</h2>
    <small id="last-sync">—</small>
  </div>

  <div class="table-grid" id="table-grid"></div>
</div>

<script>
const TOTAL_TABLES = 10;
let orders = [];

// Load config
function loadConfig() {
  const c = DB.cfg();
  document.getElementById('s-user').value = c.user;
  document.getElementById('s-repo').value = c.repo;
  document.getElementById('s-token').value = c.token;
  document.getElementById('s-pp').value = localStorage.getItem('promptpay') || '';
}

function getMenuBase() {
  return window.location.href.replace(/\/[^/]*(\?.*)?$/, '');
}

function buildQRUrl(table) {
  const c = DB.cfg();
  const base = getMenuBase();
  const k = encodeURIComponent(btoa(c.token));
  const pp = encodeURIComponent(localStorage.getItem('promptpay') || '');
  return `${base}/menu.html?table=${table}&u=${encodeURIComponent(c.user)}&r=${encodeURIComponent(c.repo)}&k=${k}&pp=${pp}`;
}

function getTableStatus(tableNum) {
  const tOrders = orders.filter(o => String(o.table) === String(tableNum));
  if (!tOrders.length) return 'available';
  if (tOrders.some(o => o.type === 'bill_request')) return 'bill';
  return 'occupied';
}

function buildGrid() {
  const grid = document.getElementById('table-grid');
  grid.innerHTML = '';

  for (let i = 1; i <= TOTAL_TABLES; i++) {
    const status = getTableStatus(i);
    const tOrders = orders.filter(o => String(o.table) === String(i) && o.type !== 'bill_request');
    const hasBill = orders.some(o => String(o.table) === String(i) && o.type === 'bill_request');

    const statusLabel = status === 'available' ? 'ว่าง' : status === 'bill' ? 'รอชำระ' : 'มีลูกค้า';
    const statusClass = status === 'available' ? 'sp-available' : status === 'bill' ? 'sp-bill' : 'sp-occupied';

    const card = document.createElement('div');
    card.className = `tbl-card ${status}`;
    card.innerHTML = `
      <div class="tbl-top">
        <div class="tbl-num">${i}</div>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
      <div class="qr-area" id="qr-area-${i}">
        <div class="qr-placeholder">กำลังสร้าง QR…</div>
      </div>
      <div class="tbl-footer">
        ${tOrders.length > 0 ? `<span class="order-count">${tOrders.length} ออเดอร์</span>` : 'ยังไม่มีออเดอร์'}
        ${hasBill ? '<br>🔔 เรียกเก็บเงินแล้ว!' : ''}
      </div>`;
    grid.appendChild(card);
  }

  // Generate QR codes (only if configured)
  if (DB.isReady()) {
    for (let i = 1; i <= TOTAL_TABLES; i++) {
      const area = document.getElementById(`qr-area-${i}`);
      area.innerHTML = '';
      new QRCode(area, {
        text: buildQRUrl(i),
        width: 110, height: 110,
        colorDark: '#1C1C1E', colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }
}

async function checkAndRefresh() {
  const bar = document.getElementById('status-bar');
  const msg = document.getElementById('status-msg');

  if (!DB.isReady()) {
    bar.className = 'status-bar warn';
    msg.textContent = '⚠️ กรอก GitHub settings ด้านบน แล้วกด "บันทึก & ทดสอบ"';
    buildGrid();
    return;
  }
  try {
    orders = await DB.getOrders();
    bar.className = 'status-bar ok';
    msg.textContent = '✅ เชื่อมต่อ GitHub สำเร็จ — ข้อมูลซิงค์ข้ามอุปกรณ์';
    document.getElementById('last-sync').textContent = 'ซิงค์: ' + new Date().toLocaleTimeString('th-TH');
    buildGrid();
  } catch(e) {
    bar.className = 'status-bar err';
    msg.textContent = '❌ เชื่อมต่อไม่ได้: ' + e.message;
    buildGrid();
  }
}

async function saveAndTest() {
  DB.saveConfig(
    document.getElementById('s-user').value.trim(),
    document.getElementById('s-repo').value.trim(),
    document.getElementById('s-token').value.trim()
  );
  const pp = document.getElementById('s-pp').value.trim();
  if (pp) localStorage.setItem('promptpay', pp);
  await checkAndRefresh();
}

async function clearOrders() {
  if (!DB.isReady()) return alert('กรุณาตั้งค่า GitHub ก่อน');
  if (!confirm('ล้างออเดอร์ทั้งหมด? (ยอดขายใน sales.json ยังคงอยู่)')) return;
  await DB.clearAllOrders();
  await checkAndRefresh();
}

loadConfig();
checkAndRefresh();
setInterval(checkAndRefresh, 30000); // refresh every 30s
</script>
</body>
</html>
