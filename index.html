<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการโต๊ะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/db.js"></script>
<style>
:root{
  --red:#DC2626;--dark:#1A1A2E;--bg:#F8F7FF;
  --card:#FFF;--sub:#64748B;--green:#059669;
  --shadow:0 2px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  --shadow-hover:0 8px 28px rgba(0,0,0,.11);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',-apple-system,sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
header{background:var(--dark);color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.2px}
.logo span{color:#FF6B6B}
header nav{display:flex;gap:6px}
nav a{color:rgba(255,255,255,.45);text-decoration:none;font-size:.78rem;padding:0 14px;height:36px;display:inline-flex;align-items:center;border-radius:99px;transition:background .2s,color .2s}
nav a:hover,nav a.active{background:rgba(255,255,255,.12);color:white}
nav a.active{color:#FF6B6B}

/* ── STATUS BAR ── */
.status-bar{padding:11px 22px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:8px}
.status-bar.ok{background:#ECFDF5;color:#065F46;border-bottom:1px solid #A7F3D0}
.status-bar.err{background:#FEF2F2;color:#991B1B;border-bottom:1px solid #FECACA}
.status-bar.warn{background:#FFFBEB;color:#92400E;border-bottom:1px solid #FDE68A}
.status-dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}

.container{max-width:1040px;margin:0 auto;padding:22px 18px}

/* ── CONFIG CARD ── */
.config-card{background:var(--card);border-radius:20px;padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid #EEEBF8}
.config-card h2{font-size:.7rem;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.9px;margin-bottom:16px}
.cfg-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cfg-row label{font-size:.82rem;color:var(--sub);min-width:72px;font-weight:600}
input[type=text],input[type=password]{background:#F8F9FA;border:1.5px solid #E9ECEF;border-radius:12px;padding:10px 14px;font-size:.88rem;outline:none;color:var(--dark);transition:border .2s,background .2s;font-family:inherit;min-height:46px}
input:focus{border-color:var(--red);background:white;box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.btn{border:none;border-radius:12px;padding:0 18px;min-height:46px;font-size:.84rem;font-weight:700;cursor:pointer;transition:background .2s,box-shadow .2s;font-family:inherit}
.btn-red{background:var(--red);color:white;box-shadow:0 3px 10px rgba(220,38,38,.25)}.btn-red:hover{background:#B91C1C;box-shadow:0 4px 14px rgba(220,38,38,.35)}
.btn-dark{background:var(--dark);color:white}.btn-dark:hover{background:#2D2D4E}
.btn-gray{background:#F3F4F6;color:#374151}.btn-gray:hover{background:#E5E7EB}
.btn-green{background:var(--green);color:white}.btn-green:hover{background:#047857}

/* ── SECTION HEADER ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-header h2{font-size:1.05rem;font-weight:900;letter-spacing:-.2px}
.section-header small{font-size:.75rem;color:var(--sub)}

/* ── TABLE GRID ── */
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}
.tbl-card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);border:2px solid transparent;transition:border .25s,box-shadow .25s,transform .2s;cursor:pointer}
.tbl-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.tbl-card.available{border-color:#A7F3D0}
.tbl-card.occupied{border-color:#FCD34D}
.tbl-card.bill{border-color:#FCA5A5;animation:pulse-border 1.5s infinite}
@keyframes pulse-border{0%,100%{border-color:#FCA5A5}50%{border-color:var(--red)}}

.tbl-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.tbl-num{font-size:1.8rem;font-weight:900;color:var(--dark);line-height:1}
.status-pill{font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.sp-available{background:#D1FAE5;color:#065F46}
.sp-occupied{background:#FEF3C7;color:#92400E}
.sp-bill{background:#FEE2E2;color:var(--red)}

.qr-area{display:flex;justify-content:center;margin-bottom:12px;min-height:108px;align-items:center}
.qr-placeholder{width:108px;height:108px;background:#F3F4F6;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:.72rem;text-align:center;padding:10px}

.tbl-footer{font-size:.72rem;color:var(--sub);text-align:center}
.order-count{color:var(--red);font-weight:800}

/* Print */
@media print{
  header,.status-bar,.config-card,.section-header .btn,body>*:not(.container){display:none!important}
  .tbl-card{page-break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  body{background:white}
  .tbl-footer{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <div class="logo">🍜 <span>ร้านอาหาร</span> Demo</div>
  <nav>
    <a href="index.html" class="active">จัดการโต๊ะ</a>
    <a href="kitchen.html">ห้องครัว</a>
    <a href="admin.html">แคชเชียร์</a>
  </nav>
</header>

<div class="status-bar warn" id="status-bar">
  <span class="status-dot"></span>
  <span id="status-msg">กำลังตรวจสอบการเชื่อมต่อ…</span>
</div>

<div class="container">
  <!-- GitHub Config -->
  <div class="config-card">
    <h2>⚙️ การตั้งค่า GitHub Storage</h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="cfg-row">
        <label>Username</label>
        <input type="text" id="s-user" placeholder="your-username" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>Repository</label>
        <input type="text" id="s-repo" placeholder="restaurant-demo" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>Token</label>
        <input type="password" id="s-token" placeholder="ghp_xxxxxxxxxxxx" style="flex:1">
      </div>
      <div class="cfg-row">
        <label>PromptPay</label>
        <input type="text" id="s-pp" placeholder="0812345678" style="flex:1">
        <span style="font-size:.75rem;color:var(--sub)">เบอร์โทร/เลขบัตร</span>
      </div>
      <div class="cfg-row">
        <button class="btn btn-red" onclick="saveAndTest()">บันทึก &amp; ทดสอบ</button>
        <button class="btn btn-gray" onclick="window.print()">🖨️ พิมพ์ QR</button>
        <button class="btn btn-dark" onclick="clearOrders()">🗑️ ล้างออเดอร์ทั้งหมด</button>
      </div>
    </div>
  </div>

  <!-- Tables -->
  <div class="section-header">
    <h2>🪑 10 โต๊ะ</h2>
    <small id="last-sync">—</small>
  </div>

  <div class="table-grid" id="table-grid"></div>
</div>

<script>
const TOTAL_TABLES = 10;
let orders = [];

// Load config
function loadConfig() {
  const c = DB.cfg();
  document.getElementById('s-user').value = c.user;
  document.getElementById('s-repo').value = c.repo;
  document.getElementById('s-token').value = c.token;
  document.getElementById('s-pp').value = localStorage.getItem('promptpay') || '';
}

function getMenuBase() {
  return window.location.href.replace(/\/[^/]*(\?.*)?$/, '');
}

function buildQRUrl(table) {
  const c = DB.cfg();
  const base = getMenuBase();
  const k = encodeURIComponent(btoa(c.token));
  const pp = encodeURIComponent(localStorage.getItem('promptpay') || '');
  return `${base}/menu.html?table=${table}&u=${encodeURIComponent(c.user)}&r=${encodeURIComponent(c.repo)}&k=${k}&pp=${pp}`;
}

function getTableStatus(tableNum) {
  const tOrders = orders.filter(o => String(o.table) === String(tableNum));
  if (!tOrders.length) return 'available';
  if (tOrders.some(o => o.type === 'payment_claimed')) return 'bill';
  if (tOrders.some(o => o.type === 'bill_request')) return 'bill';
  return 'occupied';
}

function buildGrid() {
  const grid = document.getElementById('table-grid');
  grid.innerHTML = '';

  for (let i = 1; i <= TOTAL_TABLES; i++) {
    const status = getTableStatus(i);
    const tOrders = orders.filter(o => String(o.table) === String(i) && !o.type);
    const hasBill = orders.some(o => String(o.table) === String(i) && o.type === 'bill_request');

    const statusLabel = status === 'available' ? 'ว่าง' : status === 'bill' ? 'รอชำระ' : 'มีลูกค้า';
    const statusClass = status === 'available' ? 'sp-available' : status === 'bill' ? 'sp-bill' : 'sp-occupied';

    const card = document.createElement('div');
    card.className = `tbl-card ${status}`;
    card.innerHTML = `
      <div class="tbl-top">
        <div class="tbl-num">${i}</div>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
      <div class="qr-area" id="qr-area-${i}">
        <div class="qr-placeholder">กำลังสร้าง QR…</div>
      </div>
      <div class="tbl-footer">
        ${tOrders.length > 0 ? `<span class="order-count">${tOrders.length} ออเดอร์</span>` : 'ยังไม่มีออเดอร์'}
        ${hasBill ? '<br>🔔 เรียกเก็บเงินแล้ว!' : ''}
      </div>`;
    grid.appendChild(card);
  }

  // Generate QR codes (only if configured)
  if (DB.isReady()) {
    for (let i = 1; i <= TOTAL_TABLES; i++) {
      const area = document.getElementById(`qr-area-${i}`);
      area.innerHTML = '';
      new QRCode(area, {
        text: buildQRUrl(i),
        width: 110, height: 110,
        colorDark: '#1C1C1E', colorLight: '#FFFFFF',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }
}

async function checkAndRefresh() {
  const bar = document.getElementById('status-bar');
  const msg = document.getElementById('status-msg');

  if (!DB.isReady()) {
    bar.className = 'status-bar warn';
    msg.textContent = '⚠️ กรอก GitHub settings ด้านบน แล้วกด "บันทึก & ทดสอบ"';
    buildGrid();
    return;
  }
  try {
    orders = await DB.getOrders();
    bar.className = 'status-bar ok';
    msg.textContent = '✅ เชื่อมต่อ GitHub สำเร็จ — ข้อมูลซิงค์ข้ามอุปกรณ์';
    document.getElementById('last-sync').textContent = 'ซิงค์: ' + new Date().toLocaleTimeString('th-TH');
    buildGrid();
  } catch(e) {
    bar.className = 'status-bar err';
    msg.textContent = '❌ เชื่อมต่อไม่ได้: ' + e.message;
    buildGrid();
  }
}

async function saveAndTest() {
  DB.saveConfig(
    document.getElementById('s-user').value.trim(),
    document.getElementById('s-repo').value.trim(),
    document.getElementById('s-token').value.trim()
  );
  const pp = document.getElementById('s-pp').value.trim();
  if (pp) localStorage.setItem('promptpay', pp);
  await checkAndRefresh();
}

async function clearOrders() {
  if (!DB.isReady()) return alert('กรุณาตั้งค่า GitHub ก่อน');
  if (!confirm('ล้างออเดอร์ทั้งหมด? (ยอดขายใน sales.json ยังคงอยู่)')) return;
  await DB.clearAllOrders();
  await checkAndRefresh();
}

loadConfig();
checkAndRefresh();
setInterval(checkAndRefresh, 30000); // refresh every 30s
</script>
</body>
</html>
